<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSLA Sentence Games</title>
<style>
  :root{
    --paper:#FDF6EC; --ink:#3A2E2A; --soft:#8A7A72;
    --sun:#F6B93B; --leaf:#2E9E6B; --berry:#E05B4B; --sky:#4A90D9;
    --card:#FFFFFF; --line:#E8DCCB;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:24px 16px 64px;
    background:var(--paper); color:var(--ink);
    font-family:"Comic Sans MS","Chalkboard SE","Segoe UI Rounded",-apple-system,sans-serif;
    line-height:1.6;
  }
  .wrap{ max-width:720px; margin:0 auto; }
  .byline{ margin:0 0 28px; padding-bottom:20px; border-bottom:2px solid var(--line); }
  .byline .name{ font-size:1.5rem; font-weight:bold; margin:0; }
  .byline .role{ margin:0; color:var(--soft); }
  h1{ font-size:2rem; margin:0 0 8px; }
  p.lead{ color:var(--soft); margin:0 0 32px; }
  .games{ list-style:none; padding:0; margin:0; display:grid; gap:16px; }
  .games a{
    display:block; padding:20px 24px;
    background:var(--card); border:2px solid var(--line); border-radius:16px;
    color:var(--ink); text-decoration:none;
    transition:transform .1s, border-color .1s;
  }
  .games a:hover{ transform:translateY(-2px); border-color:var(--sun); }
  .games h2{ margin:0 0 4px; font-size:1.25rem; }
  .games p{ margin:0; color:var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <header class="byline">
    <p class="name">Dan Milward</p>
    <p class="role">Primary Teacher | Games &amp; Technology | Creative Learning</p>
  </header>
  <h1>BSLA Sentence Games</h1>
  <p class="lead">Pick a game to play.</p>
  <ul class="games">
    <li>
      <a href="story-card-game.html">
        <h2>Story card game</h2>
        <p>Sort the sentences, spot the odd one out, and build your own story.</p>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
