<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --face:#FFFDF6;
    --ink:#152532;
    --ink-soft:#6A7B87;
    --hour:#E2564A;
    --minute:#15788F;
    --sun:#FFC94A;
    --moon:#E8ECF2;
    --good:#2E9E6B;
    --stroke:#D9D2C2;
    --r-card:26px;
  }

  *{box-sizing:border-box}

  html,body{height:100%}

  body{
    margin:0;
    font-family:'Outfit',ui-sans-serif,system-ui,sans-serif;
    color:var(--ink);
    background:#0D1B2A;
    display:flex;
    justify-content:center;
    transition:background 900ms linear;
  }

  .app{
    width:min(560px,100%);
    padding:3px 18px 48px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  /* ---------- sky + clock ---------- */
  .stage{
    position:relative;
    aspect-ratio:1/1;
    display:grid;
    place-items:center;
    isolation:isolate;
  }

  .stars{
    position:absolute;inset:0;
    opacity:0;
    transition:opacity 900ms linear;
    pointer-events:none;
  }
  .star{position:absolute;background:#fff;border-radius:50%;}

  .celestial{
    position:absolute;
    width:17%;aspect-ratio:1;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:0;
  }
  .celestial.sun{
    background:radial-gradient(circle at 38% 34%, #FFF2C2, var(--sun) 62%, #F2A02C);
    box-shadow:0 0 60px 18px rgba(255,201,74,.45);
  }
  .celestial.moon{
    background:radial-gradient(circle at 66% 32%, var(--moon), #B9C4D2);
    box-shadow:0 0 46px 12px rgba(232,236,242,.28);
  }
  .celestial.moon::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 30% 62%, rgba(0,0,0,.10) 0 14%, transparent 15%),
               radial-gradient(circle at 62% 70%, rgba(0,0,0,.08) 0 9%, transparent 10%),
               radial-gradient(circle at 52% 34%, rgba(0,0,0,.07) 0 11%, transparent 12%);
  }

  svg.clock{
    position:relative;
    z-index:1;
    width:94%;
    height:auto;
    touch-action:none;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.35));
  }

  .dial{fill:var(--face);stroke:var(--stroke);stroke-width:2}
  .rim{fill:none;stroke:rgba(21,37,50,.10);stroke-width:10}
  .tick-min{stroke:#B3ADA0;stroke-width:2;stroke-linecap:round}
  .tick-hr{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
  .numeral{
    font-size:30px;font-weight:600;fill:var(--ink);
    text-anchor:middle;dominant-baseline:central;
  }
  .minute-label{
    font-size:14px;font-weight:400;fill:var(--minute);opacity:.75;
    text-anchor:middle;dominant-baseline:central;
  }
  .guide{fill:none;stroke-width:1.5;stroke-dasharray:5 7}
  .guide-hr{stroke:var(--hour);opacity:.5}
  .guide-min{stroke:var(--minute);opacity:.5}

  .hand-hr{stroke:var(--hour);stroke-width:13;stroke-linecap:round}
  .hand-min{stroke:var(--minute);stroke-width:8;stroke-linecap:round}
  .grab{stroke:transparent;stroke-width:38;stroke-linecap:round;cursor:grab}
  .grab:active{cursor:grabbing}
  .grab:focus-visible{stroke:rgba(21,37,50,.16);outline:none}
  .pin{fill:var(--ink)}
  .hands{transition:none}
  .hands.smooth g{transition:transform 420ms cubic-bezier(.34,1.3,.5,1)}

  .hidden{display:none}

  /* ---------- readout ---------- */
  .readout{
    background:var(--face);
    border-radius:var(--r-card);
    padding:16px 20px 18px;
    text-align:center;
  }
  .digits{
    font-size:clamp(44px,13vw,62px);
    font-weight:800;
    line-height:1;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
  }
  .digits .meridiem{font-size:.36em;font-weight:600;color:var(--ink-soft);margin-left:.18em}
  .words{margin-top:6px;font-size:18px;font-weight:300;color:var(--ink-soft)}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  button{
    font:inherit;font-weight:600;font-size:15px;
    border:0;border-radius:999px;
    padding:10px 16px;
    background:rgba(255,253,246,.16);
    color:#fff;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:background 140ms,color 140ms,transform 140ms;
  }
  button:hover{background:rgba(255,253,246,.28)}
  button:active{transform:scale(.96)}
  button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  button[aria-pressed="true"]{background:var(--face);color:var(--ink)}

  /* ---------- transport ---------- */
  .transport{
    background:rgba(255,253,246,.14);
    backdrop-filter:blur(6px);
    border-radius:var(--r-card);
    padding:14px 18px 16px;
    display:flex;flex-direction:column;gap:10px;
  }
  .transport .row{display:flex;gap:8px;justify-content:center}
  .sliderwrap{position:relative;padding:6px 2px 2px}
  .sliderwrap::before{
    content:"";position:absolute;left:50%;top:calc(50% + 3px);
    transform:translate(-50%,-50%);
    width:2px;height:24px;background:rgba(255,255,255,.5);
    border-radius:1px;pointer-events:none;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;background:transparent;margin:0;cursor:pointer;
  }
  input[type=range]:focus-visible{outline:3px solid var(--sun);outline-offset:8px;border-radius:999px}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:rgba(255,255,255,.3)}
  input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:rgba(255,255,255,.3)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--face);border:0;margin-top:-10px;
    box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  input[type=range]::-moz-range-thumb{
    width:26px;height:26px;border-radius:50%;background:var(--face);
    border:0;box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .scale{
    display:flex;justify-content:space-between;
    font-size:12px;font-weight:300;color:rgba(255,255,255,.6);
  }
  .speedlabel{
    text-align:center;font-size:15px;font-weight:400;
    color:rgba(255,255,255,.88);
  }
  body.fast{transition:none}

  /* ---------- challenge ---------- */
  .challenge{
    background:var(--face);
    border-radius:var(--r-card);
    padding:18px 20px 20px;
    display:flex;flex-direction:column;gap:12px;align-items:center;
    text-align:center;
  }
  .challenge p{margin:0;font-size:17px;font-weight:300;color:var(--ink-soft)}
  .target{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
  .challenge .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .challenge button{background:var(--ink);color:var(--face)}
  .challenge button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(21,37,50,.18)}
  .verdict{font-size:17px;font-weight:600;min-height:1.4em}
  .verdict.yes{color:var(--good)}
  .verdict.no{color:var(--hour)}
  .score{font-size:14px;color:var(--ink-soft);font-weight:400}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:1ms !important}
  }
</style>
</head>
<body>
<div class="app">

  <div class="stage">
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="celestial sun" id="celestial" aria-hidden="true"></div>

    <svg class="clock" viewBox="0 0 400 400" role="application"
         aria-label="Interactive clock. Drag the hands, or focus a hand and use the arrow keys.">
      <circle class="rim" cx="200" cy="200" r="176"/>
      <circle class="dial" cx="200" cy="200" r="170"/>

      <g id="ticks"></g>
      <g id="numerals"></g>
      <g id="minuteLabels" class="hidden"></g>

      <circle id="guideHr"  class="guide guide-hr"  cx="200" cy="200" r="92"/>
      <circle id="guideMin" class="guide guide-min" cx="200" cy="200" r="132"/>

      <g class="hands" id="hands">
        <g id="hourGroup">
          <line class="hand-hr" x1="200" y1="200" x2="200" y2="108"/>
          <line class="grab" id="hourGrab" x1="200" y1="200" x2="200" y2="108"
                tabindex="0" role="slider" aria-label="Hour hand"/>
        </g>
        <g id="minGroup">
          <line class="hand-min" x1="200" y1="200" x2="200" y2="68"/>
          <line class="grab" id="minGrab" x1="200" y1="200" x2="200" y2="68"
                tabindex="0" role="slider" aria-label="Minute hand"/>
        </g>
      </g>

      <circle class="pin" cx="200" cy="200" r="9"/>
    </svg>
  </div>

  <div class="readout">
    <div class="digits" id="digits" aria-live="polite">7:15<span class="meridiem">am</span></div>
    <div class="words" id="words">quarter past seven in the morning</div>
  </div>

  <div class="transport">
    <div class="row">
      <button id="btnBack" aria-pressed="false">Run anti-clockwise</button>
      <button id="btnFwd"  aria-pressed="false">Run clockwise</button>
    </div>
    <div class="sliderwrap">
      <input type="range" id="speed" min="-10" max="10" step="1" value="0"
             aria-label="Speed. Left runs the clock anti-clockwise, centre stops it, right runs it clockwise.">
    </div>
    <div class="scale"><span>anti-clockwise</span><span>stop</span><span>clockwise</span></div>
    <div class="speedlabel" id="speedLabel" aria-live="polite">Stopped</div>
  </div>

  <div class="controls">
    <button id="btnLive"    aria-pressed="false">Follow real time</button>
    <button id="btn24"      aria-pressed="false">24-hour</button>
    <button id="btnMinutes" aria-pressed="false">Minute numbers</button>
    <button id="btnGuides"  aria-pressed="true">Guide rings</button>
    <button id="btnSound"   aria-pressed="false">Ticking</button>
  </div>

  <div class="challenge">
    <p>Set the hands to</p>
    <div class="target" id="target">—</div>
    <div class="row">
      <button id="btnCheck">Check</button>
      <button id="btnNew" class="ghost">New time</button>
      <button id="btnLevel" class="ghost">On the hour</button>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="score" id="score">0 right</div>
  </div>

</div>

<script>
(() => {
  const CX = 200, CY = 200;
  let minutes = 7 * 60 + 15;     // 0 – 1439
  let use24 = false, live = false, sound = false;
  let liveTimer = null, audio = null, lastTickMinute = null;
  let rate = 0, rafId = null, lastFrame = 0;

  const $ = id => document.getElementById(id);
  const hands = $('hands');

  /* ---------- build the face ---------- */
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => {
    const n = document.createElementNS(svgNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const pt = (deg, r) => {
    const a = (deg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
  };

  const ticks = $('ticks');
  for (let i = 0; i < 60; i++) {
    const big = i % 5 === 0;
    const [x1, y1] = pt(i * 6, big ? 152 : 156);
    const [x2, y2] = pt(i * 6, 164);
    ticks.appendChild(el('line', {
      x1, y1, x2, y2, class: big ? 'tick-hr' : 'tick-min'
    }));
  }

  const numerals = $('numerals'), minuteLabels = $('minuteLabels');
  for (let h = 1; h <= 12; h++) {
    const [x, y] = pt(h * 30, 124);
    const t = el('text', { x, y, class: 'numeral' });
    t.textContent = h;
    numerals.appendChild(t);

    const [mx, my] = pt(h * 30, 186);
    const m = el('text', { x: mx, y: my, class: 'minute-label' });
    m.textContent = (h * 5) % 60;
    minuteLabels.appendChild(m);
  }

  /* ---------- stars ---------- */
  const stars = $('stars');
  for (let i = 0; i < 46; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.2 + 0.8;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 62 + '%';
    s.style.opacity = 0.35 + Math.random() * 0.65;
    stars.appendChild(s);
  }

  /* ---------- sky colour ---------- */
  const KEYS = [
    { h: 0,    top: [12, 22, 46],   bot: [26, 38, 66]  },
    { h: 4.5,  top: [30, 34, 74],   bot: [92, 62, 96]  },
    { h: 6.5,  top: [86, 120, 178], bot: [246, 164, 122] },
    { h: 9,    top: [92, 160, 214], bot: [178, 214, 236] },
    { h: 13,   top: [64, 148, 216], bot: [166, 210, 240] },
    { h: 17,   top: [88, 152, 204], bot: [236, 196, 150] },
    { h: 19.2, top: [70, 78, 140],  bot: [238, 130, 106] },
    { h: 21,   top: [24, 34, 70],   bot: [58, 52, 96]   },
    { h: 24,   top: [12, 22, 46],   bot: [26, 38, 66]  }
  ];
  const lerp = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  function paintSky() {
    const h = minutes / 60;
    let i = 0;
    while (i < KEYS.length - 2 && KEYS[i + 1].h <= h) i++;
    const a = KEYS[i], b = KEYS[i + 1];
    const t = (h - a.h) / (b.h - a.h);
    document.body.style.background =
      `linear-gradient(170deg, ${rgb(lerp(a.top, b.top, t))} 0%, ${rgb(lerp(a.bot, b.bot, t))} 100%)`;

    // night factor -> stars
    const night = (h < 5.5 || h > 19.8) ? 1 : (h < 6.8 ? (6.8 - h) / 1.3 : (h > 18.6 ? (h - 18.6) / 1.2 : 0));
    stars.style.opacity = Math.min(1, Math.max(0, night));

    // sun by day, moon by night, arcing across the sky
    const body = $('celestial');
    const isDay = h >= 6 && h < 18;
    body.className = 'celestial ' + (isDay ? 'sun' : 'moon');
    const span = isDay ? (h - 6) / 12 : ((h >= 18 ? h - 18 : h + 6) / 12);
    body.style.left = (50 - 47 * Math.cos(span * Math.PI)) + '%';
    body.style.top  = (86 - 66 * Math.sin(span * Math.PI)) + '%';
  }

  /* ---------- words ---------- */
  const NAMES = ['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
  const MINS  = {5:'five past',10:'ten past',15:'quarter past',20:'twenty past',25:'twenty-five past',
                 30:'half past',35:'twenty-five to',40:'twenty to',45:'quarter to',50:'ten to',55:'five to'};

  function inWords(total) {
    const h = Math.floor(total / 60), m = total % 60;
    const partOfDay = h < 5 ? 'at night' : h < 12 ? 'in the morning'
                    : h < 17 ? 'in the afternoon' : h < 21 ? 'in the evening' : 'at night';
    const nameFor = hh => NAMES[hh % 12];
    let phrase;
    if (m === 0) phrase = `${nameFor(h)} o'clock`;
    else if (MINS[m]) phrase = m > 30 ? `${MINS[m]} ${nameFor(h + 1)}` : `${MINS[m]} ${nameFor(h)}`;
    else if (m < 30) phrase = `${m} past ${nameFor(h)}`;
    else phrase = `${60 - m} to ${nameFor(h + 1)}`;
    return `${phrase} ${partOfDay}`;
  }

  /* ---------- render ---------- */
  function fmt(mins, force24) {
    const h = Math.floor(mins / 60), m = mins % 60;
    const mm = String(m).padStart(2, '0');
    if (force24 ?? use24) return `${String(h).padStart(2, '0')}:${mm}`;
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${mm}`;
  }

  function render() {
    const hourAngle = (minutes % 720) / 720 * 360;
    const minAngle  = (minutes % 60) / 60 * 360;
    $('hourGroup').setAttribute('transform', `rotate(${hourAngle} ${CX} ${CY})`);
    $('minGroup').setAttribute('transform', `rotate(${minAngle} ${CX} ${CY})`);

    const now = shown();
    const suffix = use24 ? '' : `<span class="meridiem">${now < 720 ? 'am' : 'pm'}</span>`;
    $('digits').innerHTML = fmt(now) + suffix;
    $('words').textContent = inWords(now);

    $('hourGrab').setAttribute('aria-valuetext', inWords(now));
    $('minGrab').setAttribute('aria-valuetext', inWords(now));

    paintSky();

    if (sound && now !== lastTickMinute) {
      if (Math.abs(rate) <= 3) tick();   // don't machine-gun at high speed
      lastTickMinute = now;
    }
  }

  const wrap = v => ((v % 1440) + 1440) % 1440;
  function shown() { return Math.floor(minutes) % 1440; }

  function setMinutes(v)      { minutes = wrap(Math.round(v)); render(); }
  function setMinutesExact(v) { minutes = wrap(v);             render(); }

  /* ---------- sound ---------- */
  function tick() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1750, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.12, t + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      osc.connect(gain).connect(audio.destination);
      osc.start(t); osc.stop(t + 0.06);
    } catch (e) { /* audio unavailable */ }
  }

  function chime(ok) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const notes = ok ? [523.25, 659.25, 783.99] : [329.63, 261.63];
      notes.forEach((f, i) => {
        const t = audio.currentTime + i * 0.11;
        const osc = audio.createOscillator(), gain = audio.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain).connect(audio.destination);
        osc.start(t); osc.stop(t + 0.4);
      });
    } catch (e) {}
  }

  /* ---------- dragging ---------- */
  const svg = document.querySelector('svg.clock');

  function angleAt(evt) {
    const r = svg.getBoundingClientRect();
    const x = (evt.clientX - r.left) / r.width * 400;
    const y = (evt.clientY - r.top) / r.height * 400;
    return (Math.atan2(x - CX, CY - y) * 180 / Math.PI + 360) % 360;
  }

  function startDrag(which) {
    return e => {
      e.preventDefault();
      stopLive(); stopPlay();
      hands.classList.remove('smooth');
      let last = angleAt(e);
      const perDegree = which === 'hour' ? 2 : (1 / 6);
      const move = ev => {
        const now = angleAt(ev);
        let d = now - last;
        if (d > 180) d -= 360;
        if (d < -180) d += 360;
        last = now;
        setMinutes(minutes + d * perDegree);
      };
      const end = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', end);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', end);
    };
  }

  $('hourGrab').addEventListener('pointerdown', startDrag('hour'));
  $('minGrab').addEventListener('pointerdown', startDrag('minute'));

  function keys(step) {
    return e => {
      const map = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 };
      if (!(e.key in map)) return;
      e.preventDefault();
      stopLive(); stopPlay();
      hands.classList.add('smooth');
      setMinutes(minutes + map[e.key] * step);
    };
  }
  $('hourGrab').addEventListener('keydown', keys(60));
  $('minGrab').addEventListener('keydown', keys(1));

  /* ---------- toggles ---------- */
  const toggle = (btn, fn) => btn.addEventListener('click', () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on);
    fn(on);
  });

  toggle($('btn24'), on => { use24 = on; render(); });
  toggle($('btnMinutes'), on => minuteLabels.classList.toggle('hidden', !on));
  toggle($('btnGuides'), on => {
    $('guideHr').style.display = on ? '' : 'none';
    $('guideMin').style.display = on ? '' : 'none';
  });
  toggle($('btnSound'), on => { sound = on; if (on) tick(); });

  function stopLive() {
    if (!live) return;
    live = false;
    $('btnLive').setAttribute('aria-pressed', 'false');
    clearInterval(liveTimer);
  }
  $('btnLive').addEventListener('click', () => {
    if (live) { stopLive(); return; }
    stopPlay();
    live = true;
    $('btnLive').setAttribute('aria-pressed', 'true');
    hands.classList.add('smooth');
    const sync = () => {
      const d = new Date();
      setMinutes(d.getHours() * 60 + d.getMinutes());
    };
    sync();
    liveTimer = setInterval(sync, 1000);
  });

  /* ---------- autoplay ---------- */
  // clock-minutes travelled per real second, at slider notches 1–10
  const SPEEDS = [1, 2, 5, 10, 15, 30, 60, 120, 360, 720];
  const DEFAULT_NOTCH = 6;   // 30 minutes per second

  function speedText(n) {
    if (n === 0) return 'Stopped';
    const v = SPEEDS[Math.abs(n) - 1];
    const unit = v < 60 ? `${v} minute${v === 1 ? '' : 's'}`
               : v === 60 ? '1 hour'
               : `${v / 60} hours`;
    return `${n < 0 ? 'Anti-clockwise' : 'Clockwise'} · ${unit} per second`;
  }

  function setRate(n) {
    rate = n;
    $('speed').value = n;
    $('speedLabel').textContent = speedText(n);
    $('btnBack').setAttribute('aria-pressed', n < 0);
    $('btnFwd').setAttribute('aria-pressed', n > 0);
    document.body.classList.toggle('fast', n !== 0);

    if (n !== 0) {
      hands.classList.remove('smooth');
      stopLive();
      if (!rafId) { lastFrame = performance.now(); rafId = requestAnimationFrame(frame); }
    } else if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
      setMinutes(minutes);          // settle on a whole minute
    }
  }

  function stopPlay() { if (rate !== 0) setRate(0); }

  function frame(now) {
    const dt = Math.min(now - lastFrame, 250) / 1000;
    lastFrame = now;
    setMinutesExact(minutes + SPEEDS[Math.abs(rate) - 1] * Math.sign(rate) * dt);
    rafId = requestAnimationFrame(frame);
  }

  $('speed').addEventListener('input', e => setRate(+e.target.value));
  $('btnBack').addEventListener('click',
    () => setRate(rate < 0 ? 0 : -(Math.abs(rate) || DEFAULT_NOTCH)));
  $('btnFwd').addEventListener('click',
    () => setRate(rate > 0 ? 0 :  (Math.abs(rate) || DEFAULT_NOTCH)));

  /* ---------- challenge ---------- */
  const LEVELS = [
    { label: 'On the hour',   step: 60 },
    { label: 'Half hours',    step: 30 },
    { label: 'Five minutes',  step: 5  },
    { label: 'Any minute',    step: 1  }
  ];
  let level = 0, target = null, score = 0;

  function newTarget() {
    const step = LEVELS[level].step;
    const slots = Math.floor(1440 / step);
    let t;
    do { t = Math.floor(Math.random() * slots) * step; } while (t === target);
    target = t;
    $('target').textContent = fmt(target) + (use24 ? '' : (target < 720 ? ' am' : ' pm'));
    $('verdict').textContent = '';
    $('verdict').className = 'verdict';
  }

  $('btnNew').addEventListener('click', newTarget);

  $('btnLevel').addEventListener('click', () => {
    level = (level + 1) % LEVELS.length;
    $('btnLevel').textContent = LEVELS[level].label;
    newTarget();
  });

  $('btnCheck').addEventListener('click', () => {
    const v = $('verdict');
    const now = shown();
    if (now === target) {
      score++;
      v.textContent = 'Yes — that\u2019s it.';
      v.className = 'verdict yes';
      $('score').textContent = score + (score === 1 ? ' right' : ' right');
      chime(true);
      setTimeout(newTarget, 1400);
    } else {
      const off = Math.min(Math.abs(now - target), 1440 - Math.abs(now - target));
      v.textContent = off <= 5 ? 'So close — check the minute hand.'
                    : `Not yet. You\u2019re showing ${fmt(now)}.`;
      v.className = 'verdict no';
      chime(false);
    }
  });

  /* ---------- go ---------- */
  $('btnLevel').textContent = LEVELS[level].label;
  newTarget();
  setRate(0);
  render();
})();
</script>
</body>
</html>
